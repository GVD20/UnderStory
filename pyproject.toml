[project]
name = "understory"
version = "0.1.0a1"
description = "UnderStory desktop backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "json-repair>=0.47,<1",
  "lxml>=5.4,<7",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["pyinstaller>=6.22,<7"]
